
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лисы (API)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .fox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .fox-container img {
            width: 200px;
            border-radius: 10px;
        }
        .buttons {
            margin-top: 20px;
        }
        .buttons a {
            margin-right: 15px;
            text-decoration: none;
            color: blue;
        }
    </style>
</head>
<body>

<h1>Лисы ({{ count }} шт)</h1>

<div class="fox-container">
    {% for fox in fox_images %}
        <img src="{{ fox }}" alt="Лиса">
    {% endfor %}
</div>

<div class="buttons">

    <a href="{{ url_for('fox', n=10) }}">Показать 10 лис</a>
    <a href="{{ url_for('fox', n=4) }}">Показать 4 лисы</a>
    <a href="/kurama/">Показать Kурама</a>
    <br><br>
    <a href="/">Назад на главную</a>
</div>

</body>
</html>
