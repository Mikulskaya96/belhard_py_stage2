
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лисы (API)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .fox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .fox-container img {
            width: 200px;
            border-radius: 10px;
        }
        .buttons {
            margin-top: 20px;
        }
        .buttons a {
            margin-right: 15px;
            text-decoration: none;
            color: blue;
        }
    </style>
</head>
<body>

<h1>Лисы ({{ count }} шт)</h1>

<div class="fox-container">
    {% for fox in fox_images %}
        <img src="{{ fox }}" alt="Лиса">
    {% endfor %}
</div>

<div class="fox-actions">
    <a href="/fox/10" class="glass-button">Показать 10 лис</a>
    <a href="/fox/4" class="glass-button">Показать 4 лисы</a>
    <a href="/kurama" class="glass-button">Показать Курама</a>
    <a href="/" class="glass-button">На главную</a>
</div>

</body>
</html>
