name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v5+ / v6+ use Node 24 on the runner (avoids Node 20 deprecation warnings)
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q homework1 homework2 homework3 homework4 homework5 homework6 homework8 homework10
