{% extends "base.html" %}

{% block content %}
<h2>Список пользователей</h2>
<a href="{{ url_for('create_user') }}" class="btn">Создать нового</a>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя пользователя</th>
            <th>Email</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>
                <a href="{{ url_for('update_user', id=user.id) }}" class="btn">Редактировать</a>
                <form action="{{ url_for('delete_user', id=user.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn delete">Удалить</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
