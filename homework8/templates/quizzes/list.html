{% extends "base.html" %}

{% block content %}
<h2>Список викторин</h2>
<a href="{{ url_for('add_quiz') }}" class="btn">Добавить викторину</a>

<ul>
    {% for quiz in quizzes %}
    <li style="margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
        <strong>{{ quiz.title }}</strong>

        <a href="{{ url_for('play_quiz', quiz_id=quiz.id) }}" class="btn" style="background-color: #4CAF50; color: white; text-decoration: none; padding: 5px 10px; border-radius: 4px;">▶️ Играть</a>

        <a href="{{ url_for('edit_quiz', id=quiz.id) }}" class="btn">Редактировать</a>
        <a href="{{ url_for('delete_quiz', id=quiz.id) }}" class="btn delete">Удалить</a>
    </li>
    {% else %}
    <li>Викторин пока нет.</li>
    {% endfor %}
</ul>
{% endblock %}
